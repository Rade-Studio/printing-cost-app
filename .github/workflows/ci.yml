name: CI

# Pull requests and pushes build the site; a push to main also deploys it to
# Coolify (https://3dprintcost.radestudio.org) once the build passes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_URL: https://3dprintcost-api.radestudio.org
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `deployments: write` records each release in the repository's Deployments list.
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      TARGET: production
      TARGET_URL: https://3dprintcost.radestudio.org

    steps:
      # Bookkeeping only: if GitHub refuses the record, the release still ships.
      - name: Record the deployment on GitHub
        id: record
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(jq -n --arg ref "$GITHUB_SHA" --arg env "$TARGET" \
                '{ref: $ref, environment: $env, auto_merge: false, required_contexts: [],
                  production_environment: true, description: "Coolify deployment"}' \
            | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq '.id')
          echo "id=$id" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
            -f state=in_progress -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null

      - name: Deploy to Coolify and wait for the result
        id: coolify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APP_UUID: ${{ secrets.COOLIFY_APP_UUID_PRODUCTION }}
        run: |
          set -euo pipefail
          for name in COOLIFY_URL COOLIFY_TOKEN APP_UUID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret for $name ($TARGET)."
              exit 1
            fi
          done

          api() { curl -fsS -H "Authorization: Bearer $COOLIFY_TOKEN" -H 'Accept: application/json' "$@"; }

          # Never retried: a repeated POST queues a second deployment.
          response=$(api -X POST -H 'Content-Type: application/json' \
            -d "{\"uuid\":\"$APP_UUID\",\"force\":false}" \
            "$COOLIFY_URL/api/v1/deploy")
          deployment=$(jq -r '.deployments[0].deployment_uuid // empty' <<<"$response")
          if [ -z "$deployment" ]; then
            echo "::error::Coolify did not queue a deployment: $response"
            exit 1
          fi
          echo "Deploying $GITHUB_SHA to $TARGET (Coolify deployment $deployment)."

          # 25 minutes at 10-second intervals; the job timeout is the hard cap.
          for _ in $(seq 1 150); do
            # Reads are safe to retry; a transient error just waits for the next poll.
            status=$(api --retry 3 --retry-all-errors "$COOLIFY_URL/api/v1/deployments/$deployment" | jq -r '.status' || echo unknown)
            case "$status" in
              finished)
                echo "Deployed to $TARGET."
                exit 0 ;;
              failed|cancelled*)
                echo "::error::Coolify deployment $deployment ended as '$status'. The previous release is still serving."
                exit 1 ;;
            esac
            sleep 10
          done

          echo "::error::Coolify deployment $deployment did not finish in time (last status: $status)."
          exit 1

      - name: Report the result on GitHub
        if: always() && steps.record.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.record.outputs.id }}
          OUTCOME: ${{ steps.coolify.outcome }}
        run: |
          set -euo pipefail
          case "$OUTCOME" in
            success) state=success ;;
            *) state=failure ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            -f state="$state" -f environment_url="$TARGET_URL" \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          echo "GitHub deployment $DEPLOYMENT_ID marked $state ($TARGET_URL)."
